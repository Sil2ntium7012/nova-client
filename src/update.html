<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
<title>Nova Client 업데이트</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0e0e0e;
    overflow: hidden;
    font-family: "Malgun Gothic", "Segoe UI", sans-serif;
    -webkit-app-region: drag;
  }
  .wrap {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .mark {
    display: grid;
    grid-template-columns: repeat(3, 26px);
    grid-template-rows: repeat(3, 26px);
    gap: 8px;
    margin-bottom: 22px;
  }
  .mark span {
    background: #5fe066;
    border-radius: 5px;
    animation-name: pulse;
    animation-duration: 1.6s;
    animation-iteration-count: infinite;
    animation-timing-function: ease-in-out;
    filter: drop-shadow(0 0 6px rgba(95, 224, 102, 0.7));
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.3; transform: scale(0.9); }
    50% { opacity: 1; transform: scale(1); }
  }
  .mark span:nth-child(1) { animation-delay: 0s; }
  .mark span:nth-child(2) { animation-delay: 0.1s; }
  .mark span:nth-child(3) { animation-delay: 0.2s; }
  .mark span:nth-child(4) { animation-delay: 0.3s; }
  .mark span:nth-child(5) { animation-delay: 0.4s; }
  .mark span:nth-child(6) { animation-delay: 0.5s; }
  .mark span:nth-child(7) { animation-delay: 0.6s; }
  .mark span:nth-child(8) { animation-delay: 0.7s; }
  .mark span:nth-child(9) { animation-delay: 0.8s; }

  .title {
    font-size: 14px;
    font-weight: 700;
    color: #eef5f0;
    margin-bottom: 18px;
    letter-spacing: 0.5px;
  }
  .track {
    width: 260px;
    height: 8px;
    background: #1c2b22;
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid #1c2921;
  }
  .bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #2e7d3a, #7bff82);
    border-radius: 999px;
    transition: width 0.2s ease;
  }
  .percent {
    margin-top: 10px;
    font-family: Consolas, monospace;
    font-size: 13px;
    font-weight: 700;
    color: #5fe066;
  }
  .caption {
    margin-top: 8px;
    font-size: 11px;
    color: #7c8f83;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
    </div>
    <div class="title">새 버전으로 업데이트하는 중이에요</div>
    <div class="track"><div class="bar" id="bar"></div></div>
    <div class="percent" id="percent">0%</div>
  </div>
</body>
</html>
