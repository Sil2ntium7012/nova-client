name: Build Windows Installer

# 터미널을 아예 안 써도 되는 빌드 방법:
# 1) 이 파일을 GitHub 저장소의 .github/workflows/build.yml 경로에 커밋하면
#    (github.com 웹사이트에서 "Add file" 버튼으로 직접 올려도 됩니다 - 터미널 필요 없음)
# 2) 아래 on: 설정에 따라 자동으로, 또는 "Actions" 탭 > "Build Windows Installer" >
#    "Run workflow" 버튼을 눌러 수동으로 빌드가 시작됩니다.
# 3) 빌드가 끝나면 그 실행 페이지 맨 아래 "Artifacts"에서 NovaClient-Setup.exe를
#    다운로드하면 됩니다. 전부 GitHub 서버에서 진행되니 내 컴퓨터 정책과는 무관합니다.

on:
  workflow_dispatch: # Actions 탭에서 수동으로 "Run workflow" 눌러서 실행
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 저장소 코드 받기
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 의존성 설치
        run: npm install

      - name: Windows 설치 파일 빌드
        run: npm run dist:win

      - name: 빌드 결과물 업로드 (Artifacts에서 다운로드 가능)
        uses: actions/upload-artifact@v4
        with:
          name: NovaClient-Setup
          path: dist/*.exe
